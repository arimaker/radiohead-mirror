name: Update RadioHead mirror

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      last:
        description: "Publish the last N releases (missing ones only)"
        default: "1"
        required: false

permissions:
  contents: write

concurrency:
  group: update-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10

      - name: Publish new RadioHead releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          LAST: ${{ inputs.last || '1' }}
        run: uv run --script .github/scripts/update_mirror.py --last "$LAST"
